# Stage A + Stage B for a Python library/SDK (see standards/ENGINEERING-QUALITY-STANDARD.md).
#
#   test   : pytest across the supported Python matrix.
#   build  : build wheel+sdist, twine check, tests/dev files must not ship, install the WHEEL into a clean
#            venv and import it (tests the artifact that would be published, not the source tree).
#   audit  : pip-audit on the resolved dependency set. Advisory until `audit-blocking: true` (promotion model).
#
# Caller example (pin the ref to a full commit SHA; Dependabot keeps it current):
#   jobs:
#     ci:
#       uses: AIDEdgeInc-Lab/.github/.github/workflows/reusable-python-lib-ci.yml@<40-char-sha>
#       with:
#         import-name: aei_geo_features
#         python-versions: '["3.9","3.10","3.11","3.12"]'
name: Reusable - Python library CI

on:
  workflow_call:
    inputs:
      import-name:
        description: "Top-level module imported in the clean-install check, e.g. aei_geo_features"
        required: true
        type: string
      python-versions:
        description: "JSON array of Python versions for the test matrix"
        required: false
        type: string
        default: '["3.9","3.10","3.11","3.12"]'
      build-python-version:
        required: false
        type: string
        default: "3.12"
      extras:
        description: "Extras installed for testing, e.g. dev"
        required: false
        type: string
        default: "dev"
      test-command:
        required: false
        type: string
        default: "pytest -v"
      audit-blocking:
        description: "Fail the run on known-vulnerable dependencies (start false, flip to true once clean)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        env:
          EXTRAS: ${{ inputs.extras }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[${EXTRAS}]"
      - name: Run tests
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: eval "$TEST_COMMAND"

  build:
    name: Build and verify distribution
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.build-python-version }}
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Verify package metadata (twine check)
        run: twine check --strict dist/*
      - name: Wheel must not ship tests or development files
        run: |
          python -m zipfile --list dist/*.whl
          if python -m zipfile --list dist/*.whl | grep -E '(^|[ /])(tests?|\.github|\.env[^ ]*)/' ; then
            echo "::error::wheel contains tests/ or development-only files"; exit 1
          fi
      - name: Install the built wheel into a clean venv and import it
        env:
          IMPORT_NAME: ${{ inputs.import-name }}
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/clean/bin/python" -c "import importlib, sys; m = importlib.import_module(sys.argv[1]); print('imported', m.__name__, getattr(m, '__version__', '(no __version__)'))" "$IMPORT_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7

  audit:
    name: Dependency audit (pip-audit)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory until audit-blocking is true: a new upstream advisory must not block unrelated PRs by surprise,
    # but it must still be visible. Classification: this is an external-advisory failure, not a code defect.
    continue-on-error: ${{ !inputs.audit-blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.build-python-version }}
      - name: Install package and audit the resolved dependency set
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --skip-editable
